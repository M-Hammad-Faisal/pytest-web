name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # triggers on v0.1.0, v0.2.0, etc.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # Required for PyPI Trusted Publishing (no API token needed)
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-web
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
