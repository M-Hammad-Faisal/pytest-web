name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # triggers on v0.2.0, v0.3.0, etc.

jobs:
  # Gate: CI must be green before publishing
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pytest-web
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          pip install build setuptools-scm
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
